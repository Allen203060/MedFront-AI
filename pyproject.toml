[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medfront-ai"
version = "0.1.0"
description = "MedFront AI - Enterprise Healthcare Voice & Knowledge Platform"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = [".", "src"]
venvPath = "."
venv = ".venv"
